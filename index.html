<!DOCTYPE html>
<html lang="zh-Hant" data-shell-version="v46">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>今天還能吃幾卡</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#F3F2EE" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#131714" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="今天還能吃幾卡">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<meta name="robots" content="noindex, nofollow">
<style>
  :root{ --paper:#F3F2EE; --ink:#1A1F1B; --ink-2:#4B5551; --accent:#1F5D45;
         --surface:#fff; --line:#DCDCD2; --over:#A8362C; }
  @media (prefers-color-scheme: dark){
    :root{ --paper:#131714; --ink:#ECEFEA; --ink-2:#A8B1AB; --accent:#6FBF9A;
           --surface:#1B201D; --line:#2C332E; --over:#E4685C; }
  }
  *{box-sizing:border-box}
  html{margin:0;padding:0;height:100%;height:100dvh;background:var(--paper);overflow:hidden}
  body{margin:0;height:var(--shell-height,100dvh);padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);background:var(--paper);overflow:hidden}
  body{font:15px/1.6 "Noto Sans TC",system-ui,-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif;color:var(--ink)}
  #app{display:block;width:100%;height:100%;border:0}
  .updatebar{
    position:fixed;z-index:5;top:max(8px,env(safe-area-inset-top));left:50%;
    transform:translate(-50%,-12px);display:flex;align-items:center;gap:10px;
    padding:8px 8px 8px 13px;border:1px solid var(--line);border-radius:999px;
    background:var(--surface);box-shadow:0 8px 24px rgba(0,0,0,.16);
    color:var(--ink);font-size:12.5px;opacity:0;pointer-events:none;transition:.2s ease;
  }
  .updatebar.show{transform:translate(-50%,0);opacity:1;pointer-events:auto}
  .updatebar button{border:0;border-radius:999px;padding:6px 10px;background:var(--accent);color:#fff;font:inherit;font-weight:700;cursor:pointer}
  /* v35：iframe 載完前的等待畫面（v69 起資料一次到位，開頁會先空白約 2.6 秒） */
  .boot{
    position:fixed;inset:0;z-index:4;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
    background:var(--paper);color:var(--ink-2);pointer-events:none;transition:opacity .25s ease;
  }
  .boot.done{opacity:0}
  .boot img{width:64px;height:64px;border-radius:16px}
  .boot b{color:var(--ink);font-size:16px}
  .boot span{display:flex;align-items:center;gap:8px;font-size:13px}
  .boot em{font-style:normal}
  .boot i{width:14px;height:14px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:bootspin .8s linear infinite}
  @keyframes bootspin{to{transform:rotate(360deg)}}
  @media (prefers-reduced-motion: reduce){ .boot i{animation-duration:2.4s} }
  /* v46：上次開啟時的快照（剩餘熱量、最近體重） */
  .boot.has-snap img{width:48px;height:48px;border-radius:12px}
  .snap{display:flex;flex-direction:column;align-items:center;gap:2px;margin:6px 0 4px;text-align:center}
  .snapnum{color:var(--accent);font-size:44px;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums}
  .snapnum.over{color:var(--over)}
  .snapcap{color:var(--ink);font-size:14px}
  .snapw{color:var(--ink);font-size:15px;margin-top:8px;font-variant-numeric:tabular-nums}
  .snapat{color:var(--ink-2);font-size:12px;margin-top:6px}
  /* 沒有設定目標網址時才會看到這一頁 */
  .setup{height:100%;display:flex;align-items:center;justify-content:center;padding:24px 16px}
  .box{width:100%;max-width:440px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px}
  h1{font-size:19px;margin:0 0 4px}
  .sub{font-size:12.5px;letter-spacing:.14em;color:var(--ink-2);margin:0 0 16px}
  p{font-size:13.5px;color:var(--ink-2);margin:0 0 14px}
  input{width:100%;padding:11px 12px;font:inherit;font-size:13.5px;border:1px solid var(--line);border-radius:10px;background:var(--paper);color:var(--ink)}
  .setup button{margin-top:12px;width:100%;padding:11px;font:inherit;font-weight:500;border:0;border-radius:10px;background:var(--accent);color:#fff;cursor:pointer}
  .err{color:#A8362C;font-size:13px;margin-top:10px;display:none}
  code{font-size:12px;word-break:break-all;color:var(--ink-2)}
</style>
</head>
<body>
<script>
(function(){
  var LS = "kcalShell.target";
  var LS_USER = "kcalShell.user";
  var LS_SNAP = "kcalShell.snap";
  var SHELL_VERSION = "v46";
  var APP_VERSION = "80";
  var USER_RE = /^[一-鿿぀-ヿA-Za-z0-9_\- ]{1,20}$/;
  // v44：主畫面捷徑（manifest shortcuts）開進來時帶 ?go=weight，轉給程式捲到體重卡。只認白名單裡的值
  var GO = "";
  try{ GO = new URLSearchParams(location.search).get("go") === "weight" ? "weight" : ""; }catch(e){}

  // v34：程式告訴外殼目前是誰（只收名字，不收任何紀錄），下次開頁帶 ?u=，
  // 後端就能把資料直接嵌進頁面，省掉開場一趟往返。只接受 Apps Script 內容網域送來的訊息。
  window.addEventListener("message", function(e){
    if(!/^https:\/\/[a-z0-9-]+-script\.googleusercontent\.com$/.test(e.origin)) return;
    var d = e.data;
    if(d && d.type === "kcal-snap"){ var s = cleanSnap(d); if(s) try{ localStorage.setItem(LS_SNAP, JSON.stringify(s)); }catch(err){} return; }
    if(!d || d.type !== "kcal-user" || typeof d.user !== "string") return;
    var u = d.user.trim();
    if(!USER_RE.test(u)) return;
    try{ localStorage.setItem(LS_USER, u); }catch(err){}
  });

  // v46：程式送來的「今天還可以吃幾卡＋最近體重」快照（Rio 2026-11-26 同意存在這台裝置）。
  // 下次開頁時先秀在等待畫面上；只收數字與日期，格式不對整則丟掉。
  var DATE_RE = /^\d{4}-\d{2}-\d{2}$/;
  function cleanSnap(d){
    if(!d || typeof d.user !== "string" || !USER_RE.test(d.user.trim()) || typeof d.date !== "string" || !DATE_RE.test(d.date)) return null;
    var left = Number(d.left), target = Number(d.target), at = Number(d.at);
    if(!isFinite(left) || Math.abs(left) > 20000 || !isFinite(target) || target < 500 || target > 10000 || !isFinite(at) || at <= 0) return null;
    var w = d.w == null ? null : Number(d.w);
    if(w != null && !(isFinite(w) && w >= 25 && w <= 250)) return null;
    var wDate = typeof d.wDate === "string" && DATE_RE.test(d.wDate) ? d.wDate : "";
    return {user:d.user.trim(), date:d.date, left:Math.round(left), target:Math.round(target), w:w == null ? null : Math.round(w * 10) / 10, wDate:wDate, at:at};
  }
  function dayKey(t){
    var x = new Date(t);
    return x.getFullYear() + "-" + String(x.getMonth() + 1).padStart(2, "0") + "-" + String(x.getDate()).padStart(2, "0");
  }
  function shortDate(key){ var p = key.split("-"); return (+p[1]) + "/" + (+p[2]); }
  function fmt(n){ return Math.round(n).toLocaleString("en-US"); }
  // 回傳要放進等待畫面的節點；沒有可用的快照就回 null（等待畫面維持原樣）
  function snapNode(user){
    var s = null;
    try{ s = cleanSnap(Object.assign({type:"kcal-snap"}, JSON.parse(localStorage.getItem(LS_SNAP) || "null"))); }catch(e){ s = null; }
    var now = Date.now();
    if(!s || s.user !== user || s.at > now + 600000 || now - s.at > 14 * 86400000) return null;
    var today = dayKey(now), yday = dayKey(now - 86400000);
    var box = document.createElement("div");
    box.className = "snap";
    function line(cls, text){ var n = document.createElement("div"); n.className = cls; n.textContent = text; box.appendChild(n); return n; }
    if(s.date === today){
      var over = s.left < 0;
      line("snapnum" + (over ? " over" : ""), over ? "+" + fmt(-s.left) : fmt(s.left));
      line("snapcap", over ? "大卡 · 超出額度" : "大卡 · 還可以吃");
    } else {
      line("snapcap", "每日目標 " + fmt(s.target) + " 大卡");
    }
    if(s.w != null) line("snapw", "體重 " + s.w.toFixed(1) + " kg" + (s.wDate ? "（" + (s.wDate === today ? "今天" : s.wDate === yday ? "昨天" : shortDate(s.wDate)) + "）" : ""));
    var at = new Date(s.at), hm = String(at.getHours()).padStart(2, "0") + ":" + String(at.getMinutes()).padStart(2, "0");
    line("snapat", "上次開啟時的資料 · " + (dayKey(s.at) === today ? "今天 " : shortDate(dayKey(s.at)) + " ") + hm);
    return box;
  }

  function syncViewportHeight(){
    var h = window.visualViewport ? window.visualViewport.height : window.innerHeight;
    document.documentElement.style.setProperty("--shell-height", Math.round(h) + "px");
  }
  syncViewportHeight();
  if(window.visualViewport) window.visualViewport.addEventListener("resize", syncViewportHeight);
  window.addEventListener("orientationchange", syncViewportHeight);

  // 只接受這支 Apps Script web app 的網址。
  // 這頁是公開的，不做白名單就等於做了一個「能嵌任何網站」的外殼給別人拿去釣魚。
  function ok(u){
    try{
      var x = new URL(u);
      return x.protocol === "https:" &&
             x.hostname === "script.google.com" &&
             x.pathname.indexOf("/macros/") === 0;
    }catch(e){ return false; }
  }

  function fromHash(){
    var h = location.hash.replace(/^#/, "");
    if(!h) return "";
    var m = /(?:^|&)u=([^&]+)/.exec(h);
    var raw = m ? m[1] : h;
    try{
      // base64url → 一般 base64
      var b = raw.replace(/-/g, "+").replace(/_/g, "/");
      while(b.length % 4) b += "=";
      return decodeURIComponent(escape(atob(b)));
    }catch(e){ return decodeURIComponent(raw); }
  }

  function mount(url){
    // 網址只留在這台裝置，換掉 hash 免得之後被人從網址列看到
    try{ localStorage.setItem(LS, url); }catch(e){}
    // ?go= 也一起拿掉：之後按「有新版可用 → 重新載入」不要再跳一次
    try{
      var here = new URL(location.href);
      here.hash = "";
      here.searchParams.delete("go");
      if(location.hash || location.search !== here.search) history.replaceState(null, "", here.pathname + here.search);
    }catch(e){}
    var f = document.createElement("iframe");
    f.id = "app";
    try{
      var appUrl = new URL(url);
      appUrl.searchParams.set("__kcal_v", APP_VERSION);
      appUrl.searchParams.set("__kcal_shell", SHELL_VERSION);
      var lastUser = "";
      try{ lastUser = localStorage.getItem(LS_USER) || ""; }catch(err){}
      if(USER_RE.test(lastUser) && !appUrl.searchParams.has("u")) appUrl.searchParams.set("u", lastUser);
      if(GO) appUrl.searchParams.set("go", GO);
      f.src = appUrl.toString();
    }catch(e){ f.src = url; }
    f.setAttribute("allow", "clipboard-write");
    document.body.innerHTML = "";
    var update = document.createElement("div");
    update.className = "updatebar";
    update.innerHTML = '<span>有新版可用</span><button type="button">重新載入</button>';
    update.querySelector("button").onclick = function(){
      var next = new URL(location.href);
      next.searchParams.set("_shell", String(Date.now()));
      location.replace(next.toString());
    };
    document.body.appendChild(update);

    // iframe 的 load 會等內層 Apps Script 頁面也載完才觸發，這時程式已經畫好第一個畫面。
    // 等待畫面不擋點擊（pointer-events:none）；12 秒還沒好就改字，但不自己消失，免得露出空白。
    var boot = document.createElement("div");
    boot.className = "boot";
    boot.setAttribute("role", "status");
    boot.innerHTML = '<img src="icon-192.png" alt=""><b>今天還能吃幾卡</b><span><i></i><em>載入中…</em></span>';
    var lastSnapUser = "";
    try{ lastSnapUser = localStorage.getItem(LS_USER) || ""; }catch(err){}
    var snap = USER_RE.test(lastSnapUser) ? snapNode(lastSnapUser) : null;
    if(snap){
      boot.classList.add("has-snap");
      boot.insertBefore(snap, boot.querySelector("span"));
      boot.querySelector("em").textContent = "同步最新資料…";
    }
    var slow = setTimeout(function(){ boot.querySelector("em").textContent = "還在載入，網路可能比較慢…"; }, 12000);
    f.addEventListener("load", function(){
      clearTimeout(slow);
      if(!boot.parentNode) return;
      boot.classList.add("done");
      setTimeout(function(){ if(boot.parentNode) boot.parentNode.removeChild(boot); }, 300);
    });
    document.body.appendChild(boot);
    document.body.appendChild(f);

    function checkUpdate(){
      fetch("./index.html?_check=" + Date.now(), {cache:"no-store"}).then(function(r){ return r.text(); }).then(function(html){
        var match = /data-shell-version=["']([^"']+)["']/.exec(html);
        if(match && match[1] !== SHELL_VERSION) update.classList.add("show");
      }).catch(function(){});
    }
    setTimeout(checkUpdate, 3000);
    setInterval(checkUpdate, 300000);
    document.addEventListener("visibilitychange", function(){ if(!document.hidden) checkUpdate(); });
  }

  function setup(){
    document.body.innerHTML =
      '<div class="setup"><div class="box">' +
        '<h1>今天還能吃幾卡</h1>' +
        '<p class="sub">CALORIE &amp; WATER DIARY</p>' +
        '<p>第一次開啟，貼上你的 Apps Script 網址（<code>https://script.google.com/macros/s/…/exec</code>），之後這台裝置就會記住。</p>' +
        '<input id="u" type="url" inputmode="url" placeholder="https://script.google.com/macros/s/.../exec">' +
        '<button id="go">開始使用</button>' +
        '<div class="err" id="err">網址不對 —— 必須是 script.google.com 的 /macros/ 網址。</div>' +
      '</div></div>';
    document.getElementById("go").onclick = function(){
      var v = document.getElementById("u").value.trim();
      if(ok(v)) mount(v); else document.getElementById("err").style.display = "block";
    };
  }

  var target = fromHash();
  if(!ok(target)){ try{ target = localStorage.getItem(LS) || ""; }catch(e){ target = ""; } }
  if(ok(target)) mount(target); else setup();
})();
</script>
</body>
</html>
